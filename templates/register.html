{% extends "base.html" %}

{% block auth_content %}
<div class="auth-container">
    <div class="auth-header">
        <h2>Register Account</h2>
        <p class="text-muted">AI Vehicle & Insurance Intelligence System</p>
    </div>
    <form action="{{ url_for('register') }}" method="POST">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Choose a username">
            </div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" required placeholder="Enter email address">
            </div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Choose a password">
            </div>
        </div>
        <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-primary py-2 fw-bold">Sign Up</button>
        </div>
        <div class="text-center mt-3">
            <span class="text-muted">Already have an account? </span><a href="{{ url_for('login') }}">Log in here</a>
        </div>
    </form>
</div>
{% endblock %}
