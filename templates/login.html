{% extends "base.html" %}

{% block auth_content %}
<div class="auth-container">
    <div class="auth-header">
        <h2><i class="fa-solid fa-car-rear text-primary me-2"></i>AutoIntel</h2>
        <p class="text-muted">AI Vehicle & Insurance Intelligence System</p>
    </div>
    <form action="{{ url_for('login') }}" method="POST">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Enter username">
            </div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
            </div>
        </div>
        <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-primary py-2 fw-bold">Log In</button>
        </div>
        <div class="text-center mt-3">
            <span class="text-muted">Don't have an account? </span><a href="{{ url_for('register') }}">Register here</a>
        </div>
    </form>
</div>
{% endblock %}
